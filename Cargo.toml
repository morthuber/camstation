[package]
name = "camstation"
version = "0.4.3"
edition = "2024"
description = "A configurable multi-camera RTSP station for Linux"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.25"
gtk4 = { version = "0.11", features = ["v4_14"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1.9"
serial_test = "4.0"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "debuginfo"
